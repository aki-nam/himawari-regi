<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>ひまわり パンの予約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}
/* Layout: phone-first order page — date on top, bread button grid, sticky total bar; the second step collects delivery details */
:root{
  --bg:#fbf6ee; --surface:#ffffff; --fg:#2a241c; --muted:#6b6255; --line:#e3dacb;
  --accent:#b8561f; --accent-fg:#ffffff; --sun:#f2b705; --sun-fg:#2a2100;
  --cat1:#fdf1d6; --cat2:#e3f0e8; --cat3:#e6ecf7; --danger:#b3261e; --ok:#1f6b4a;
  --f-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#221c16; --fg:#f1e9dd; --muted:#b3a794; --line:#3a3128;
  --accent:#f08a4b; --accent-fg:#1d0e04; --sun:#f2c33a; --sun-fg:#231b00;
  --cat1:#33291a; --cat2:#1d3127; --cat3:#1f2736; --danger:#ff8a80; --ok:#4fb385; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#221c16; --fg:#f1e9dd; --muted:#b3a794; --line:#3a3128;
  --accent:#f08a4b; --accent-fg:#1d0e04; --sun:#f2c33a; --sun-fg:#231b00;
  --cat1:#33291a; --cat2:#1d3127; --cat3:#1f2736; --danger:#ff8a80; --ok:#4fb385; color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}
h1{font-family:var(--f-display);font-weight:800;font-size:1.3rem;margin:4px 0 2px;display:flex;align-items:center;gap:8px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--sun);flex:none}
h2{font-family:var(--f-display);font-size:1.12rem;margin:18px 0 8px}
.note{font-size:.88rem;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
label.q{display:block;font-weight:700;margin-bottom:4px}
.req{color:var(--danger);font-size:.85rem;margin-left:4px}
select,input[type=text],input[type=email],textarea{font:inherit;width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
textarea{min-height:5.5em}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.chips button{flex:none;font:inherit;font-size:.95rem;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.item{position:relative;text-align:left;min-height:92px;padding:10px 10px 8px;border-radius:12px;border:1px solid var(--line);color:var(--fg);cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;gap:4px;font:inherit;-webkit-tap-highlight-color:transparent;transition:transform .06s}
.item:active{transform:scale(.97)}
.item[data-cat="菓子パン"]{background:var(--cat1)} .item[data-cat="惣菜パン"]{background:var(--cat2)} .item[data-cat="サンド・パイ・他"]{background:var(--cat3)}
.item .nm{font-family:var(--f-display);font-weight:800;line-height:1.3;word-break:break-word}
.item .pr{color:var(--muted);font-variant-numeric:tabular-nums}
.item .hp{font-size:.78rem;color:var(--muted);line-height:1.3}
.item.off{opacity:.45;cursor:not-allowed}
.item.off .hp{color:var(--danger);font-weight:700}
.badge{position:absolute;top:-6px;right:-6px;min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:var(--sun);color:var(--sun-fg);
  font-family:var(--f-display);font-weight:800;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .sum{flex:1;min-width:0}
.bar .cnt{font-size:.85rem;color:var(--muted)}
.bar .tot{font-family:var(--f-display);font-weight:800;font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
.btn{font-family:var(--f-display);font-weight:800;font-size:1.05rem;border-radius:12px;padding:12px 18px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.item:focus-visible,.chips button:focus-visible,.opt input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1}
.fields{display:flex;flex-direction:column;gap:14px}
.opt{display:flex;flex-direction:column;gap:6px}
.opt label{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.opt input[type=radio]{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.lines{display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.line small{display:block;color:var(--muted)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:1.3rem;font-weight:700;cursor:pointer}
.qty span{min-width:2ch;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.amt{font-variant-numeric:tabular-nums;font-weight:700;min-width:5.5ch;text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-weight:800;margin-top:8px}
.total .v{font-size:1.8rem;font-variant-numeric:tabular-nums}
.err{background:color-mix(in srgb,var(--danger) 10%,var(--surface));border:1px solid var(--danger);border-radius:12px;padding:10px 12px;color:var(--fg)}
.done{border-left:6px solid var(--ok)}
.notice{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--sun);border-radius:12px;padding:10px 12px;margin-bottom:12px;white-space:pre-line}
.notice b{font-family:var(--f-display);display:block;margin-bottom:2px}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.dest{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dest b{font-size:1.1rem}
.dest button,.dchips button{font:inherit;font-size:.95rem;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.dchips button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.wk{margin-top:10px;background:var(--cat3);border-radius:10px;padding:8px 12px}
.wk b{font-family:var(--f-display)}
.wk dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:4px 0 0}
.wk dt{color:var(--muted);font-size:.9rem}.wk dd{margin:0;font-weight:700}
.line .wkc{grid-column:1/-1;margin:-2px 0 2px;padding:8px 10px;border-radius:10px;background:var(--cat3)}
.wkc .need{font-size:.9rem;font-weight:700;margin-bottom:4px}
.wkc .need.ng{color:var(--danger)}
.qty button:disabled{opacity:.35;cursor:default}
.wkc .o{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0}
@media (prefers-reduced-motion: reduce){.item{transition:none}}
</style></head><body>
<div class="wrap">
  <h1><span class="dot" aria-hidden="true"></span>手作りパン工房 ひまわり　ご予約</h1>
  <p class="note" id="lead">お届け日を選んで、パンを押してください（1回押すと1個）。<br>途中でやめるときは、そのまま画面を閉じてください（【予約する】を押すまで送られません）。</p>
  <div id="app"><div class="loading">メニューを読み込んでいます…<br><span class="note">はじめは10秒ほどかかることがあります。このままお待ちください。</span></div></div>
</div>
<div class="bar" id="bar" hidden>
  <div class="in">
    <div class="sum"><div class="cnt" id="cnt">0個</div><div class="tot" id="tot">¥0</div></div>
    <button class="btn" id="b-back" type="button" hidden>パンにもどる</button>
    <button class="btn primary" id="b-next" type="button">次へ</button>
  </div>
</div>
<script>
(function(){
// 予約の受け口（Googleフォームのスクリプトを「ウェブアプリ」で公開したアドレス）
const API = "https://script.google.com/macros/s/AKfycbwe43NaC-74opct2oFcT_eYghWVA6nsGdyosm4Av-7s6cR_Odaj2bOSpHBjZf5SbeaF/exec";
// うまくいかないときのGoogleフォーム
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSeJ2d926GBPr4JCRqLnx4GRdXY5N-hNS1gOYldx6XKidnkBzg/viewform";
// LINE公式アカウントの友だち追加（HPの「LINEで予約する」と同じアドレス）
const LINE_ADD = "https://lin.ee/o9oA0UH";
// LINE の中（リッチメニューなど）で開いたときは、もう友だちなので友だち追加のボタンは出さない
const IN_LINE = /\bLine\//i.test(navigator.userAgent);
const KEY = "himawari-yoyaku-v1";   // このスマホに覚えること（お届け先・お名前など）
const CATS = ["菓子パン","惣菜パン","サンド・パイ・他"];

const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nk = s => String(s||"").normalize("NFKC").trim();
const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");
function catOf(n){
  if(/ホイップサンド/.test(n)) return "菓子パン";
  if(/サンド|パイ|食パン|ドーナツ/.test(n)) return "サンド・パイ・他";
  if(/調理|キャベツ|バーガー|カレー|ウインナー|ウィンナー|ベーコン|ホットドッグ|ハムエッグ|ピザ|ダブルチーズ|おやき|ちくわ/.test(n)) return "惣菜パン";
  return "菓子パン";
}

let F = null;          // フォームの中身
let breads = [], fields = [], notices = [], cart = {}, vals = {}, step = "pick", catFilter = "すべて", sending = false;
let weekly = null, kineya = {}, sandPick = {key:"", n:{}};   // 週替わりの中身（お届け日ごと）と、選んだサンドイッチの中身
let offices = [], destEdit = false, destFree = false, destQ = "", dateMode = "", dateReason = "";  // dateMode: late=締め切り後の取り置き / other=決まった日以外  // 事業所ごとのお届け日・お届け先を選び直し中か
const KINEYA_DEST = "喜ね舎で受け取り";
let mem = {}; try{ mem = JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){}
function remember(){ try{ localStorage.setItem(KEY, JSON.stringify(mem)); }catch(e){} }

/* ---------- フォームの質問を、パン（個数を選ぶ欄）とそのほかに分ける ---------- */
function build(info){
  F = info; breads = []; fields = []; notices = []; weekly = null; kineya = {}; offices = [];
  info.items.forEach(it=>{
    // フォームの［週替わりメニュー（お届け日ごと）］（Excelのボタンで作った文を貼ったもの）
    if((it.type==="SECTION_HEADER"||it.type==="PAGE_BREAK") && /週替わり/.test(it.title) && /[■▽]/.test(it.help||"")){ weekly = parseWeekly(it.help); kineya = parseKineya(it.help); offices = parseOffices(it.help); return; }
    // フォームの「タイトルと説明」で、タイトルが「お知らせ」で始まるものを、画面のいちばん上に出す
    if((it.type==="SECTION_HEADER"||it.type==="PAGE_BREAK") && /^[\s【\[「]*お知らせ/.test(it.title) && (it.help||"").trim()){
      notices.push({title:it.title.trim().replace(/^[【\[「]|[】\]」]$/g,""), help:it.help.trim()}); return; }
    const t = nk(it.title);
    const m = t.match(/^(.*?)\s*([0-9]{2,5})\s*円?$/);
    if(it.type==="LIST" && m && (it.choices||[]).some(c=>/^1$/.test(nk(c)))){
      const five = (it.choices||[]).find(c=>/5個以上/.test(nk(c)));
      breads.push({id:it.id, name:m[1].trim(), price:Number(m[2]), help:nk(it.help), choices:it.choices, five, cat:catOf(m[1]), wk:wkOf(m[1].trim())});
    } else if(["LIST","MULTIPLE_CHOICE","TEXT","PARAGRAPH_TEXT"].includes(it.type)){
      fields.push(Object.assign({}, it, {kind:kindOf(it)}));
    } else if(it.type==="SECTION_HEADER" && /LINE/.test(it.title) && /最初のメッセージ|送信/.test(it.title+it.help)){
      fields.lineNote = it;   // LINEで受け取る人への大事な説明
    }
  });
  // 前に入れたものを入れておく
  fields.forEach(f=>{ if(f.kind!=="date" && f.kind!=="msg" && mem[f.title]!=null && vals[f.id]===undefined){ vals[f.id]=mem[f.title]; if(mem[f.title+"_o"]!=null) vals[f.id+"_o"]=mem[f.title+"_o"]; } });
}
function kindOf(it){
  const t = it.title;
  if(/納品希望日|お届け日/.test(t)) return "date";
  if(/お届け先/.test(t) && it.type==="MULTIPLE_CHOICE") return "dest";
  if(/連絡|メッセージ/.test(t) && it.type==="PARAGRAPH_TEXT") return "msg";
  if(/受け取り方法/.test(t)) return "recv";
  if(/メールアドレス/.test(t)) return "mail";
  if(/LINEのお名前/.test(t)) return "line";
  return "other";
}
const fieldOf = k => fields.find(f=>f.kind===k);

/* ---------- 週替わり（サンドイッチ・ピザパン・調理パン） ---------- */
// 「■11月5日・6日（木・金）」の下に「サンドイッチ：A／B（どちらか1つ）」「ピザパン：…」「調理パン：…」
function parseWeekly(text){
  const W = {}; let cur = null;
  nk(text).split(/\n/).forEach(l=>{
    l = l.trim();
    if(/^■/.test(l)){
      const h = l.slice(1).replace(/\(.*$/,""), mo = Number((h.match(/(\d{1,2})月/)||[])[1]);
      let ds = [...h.replace(/^.*?月/,"").matchAll(/(\d{1,2})日/g)].map(x=>Number(x[1]));
      if(/[〜~]/.test(h) && ds.length===2){ const a=ds[0], b=ds[1]; ds=[]; for(let d=a; d<=b; d++) ds.push(d); }
      cur = {label:l.slice(1), sand:[], pizza:"", chori:""};
      if(mo) ds.forEach(d=>{ W[mo+"-"+d] = cur; });
      return;
    }
    const m = cur && l.match(/^(サンドイッチ|ピザパン|ピザ|調理パン)\s*:\s*(.+)$/); if(!m) return;
    const v = m[2].replace(/\(どちらか.*?\)/,"").trim(), none = /^(なし|―|-)$/.test(v);
    if(m[1]==="サンドイッチ") cur.sand = none ? [] : v.split("/").map(s=>s.trim()).filter(Boolean);
    else if(m[1]==="調理パン") cur.chori = none ? "" : v;
    else cur.pizza = none ? "" : v;
  });
  return Object.keys(W).length ? W : null;
}
// 「◆喜ね舎の出店日：11月28日（土）」→ その日は食パン・ドーナツを予約できない
function parseKineya(text){
  const K = {};
  nk(text).split(/\n/).forEach(l=>{
    if(!/^\s*◆.*喜ね舎/.test(l)) return;
    let mo = 0;
    for(const x of l.replace(/\(.*?\)/g,"").matchAll(/(?:(\d{1,2})月)?(\d{1,2})日/g)){ if(x[1]) mo = Number(x[1]); if(mo) K[mo+"-"+Number(x[2])] = true; }
  });
  return K;
}
const isKineya = dt => !!(dt && kineya[(dt.getMonth()+1)+"-"+dt.getDate()]);
// 「▽福井コンピュータ：12月4日・11日・18日・25日」→ 事業所ごとのお届け日（同じ名前が何か月分あってもまとめる）
function parseOffices(text){
  const O = [], by = {};
  String(text||"").split(/\n/).forEach(l=>{
    const m = l.trim().match(/^▽\s*(.+?)\s*[：:]\s*(.+)$/); if(!m) return;
    const name = m[1].replace(/\s+/g," ").trim(); let mo = 0;
    if(!by[name]){ by[name] = {name, key:nk(name).replace(/\s/g,""), days:{}}; O.push(by[name]); }
    // 「▽岡保公民館：日を選ぶ」のように日付がない事業所は、日が決まっていないので、どの日でも選べる
    if(!/\d{1,2}日/.test(nk(m[2]))) by[name].flex = true;
    for(const x of nk(m[2]).replace(/\(.*?\)/g,"").matchAll(/(?:(\d{1,2})月)?(\d{1,2})日/g)){ if(x[1]) mo = Number(x[1]); if(mo) by[name].days[mo+"-"+Number(x[2])] = true; }
  });
  return O;
}
const officeOf = name => { const k = nk(name).replace(/\s/g,""); return k ? offices.find(o=>o.key===k) : null; };
const hasKineya = () => Object.keys(kineya).length > 0;

/* ---------- お届け先（事業所を選ぶ → その事業所のお届け日だけ出す） ---------- */
// いま選んでいるお届け先。フォームへは、事業所は「その他」の欄に名前を書いた形で送る
function destSel(){
  const f = fieldOf("dest"); if(!f) return null;
  const v = vals[f.id]; if(!v) return null;
  if(v!=="__other") return {kind:"pre", label:v};
  const o = (vals[f.id+"_o"]||"").trim();
  if(destFree) return {kind:"free", label:o};
  if(o===KINEYA_DEST) return {kind:"kineya", label:"喜ね舎の会場で受け取る"};
  const of = officeOf(o); if(of) return {kind:"office", label:of.name, office:of};
  return o ? {kind:"free", label:o} : null;
}
function setDest(kind, value){
  const f = fieldOf("dest"); if(!f) return;
  destFree = kind==="free"; dateMode = ""; dateReason = "";
  if(kind==="pre"){ vals[f.id] = value; delete vals[f.id+"_o"]; }
  else if(kind==="clear"){ delete vals[f.id]; delete vals[f.id+"_o"]; }
  else { vals[f.id] = "__other"; vals[f.id+"_o"] = kind==="kineya" ? KINEYA_DEST : value; }
  // お届け先が変わって、選んでいた日がその事業所の日でなくなったら、日を選び直してもらう
  const df = fieldOf("date"); if(df && vals[df.id] && !dateChoices().includes(vals[df.id])){ delete vals[df.id]; delete vals[df.id+"_o"]; }
}
// 入れた文字で始まる（2文字からは、途中に入っていても）事業所だけを候補に出す。一覧そのものは見せない
function destCands(){
  const q = nk(destQ).replace(/\s/g,""); if(!q) return [];
  const a = offices.filter(o=>o.key.startsWith(q)), b = q.length>=2 ? offices.filter(o=>!o.key.startsWith(q) && o.key.includes(q)) : [];
  return a.concat(b).slice(0,6);
}
function candsHtml(){
  const c = destCands(), q = destQ.trim();
  return (c.length ? `<div class="dchips" role="list" aria-label="候補">${c.map(o=>`<button type="button" data-office="${esc(o.name)}">${esc(o.name)}</button>`).join("")}</div>` : "")
    + (q ? `<div style="margin-top:8px"><button type="button" class="btn" data-destfree="1" style="width:100%">${c.length?"候補にない新しいお取引先です（":"「"}${esc(q)}${c.length?"）":"」で決める"}</button>
      <p class="note" style="margin:4px 0 0">${c.length?"候補にあるときは、上の名前を押してください。":"はじめてのお取引先は、名前を全部入れて押してください。お届け日は、こちらで確かめてご連絡します。"}</p></div>` : "");
}
function destBlock(){
  const f = fieldOf("dest"); if(!f) return "";
  const s = destSel();
  if(s && s.label && !destEdit) return `<div class="dest" style="margin-bottom:10px"><div><span class="note">お届け先</span><br><b>${esc(s.label)}</b></div><button type="button" data-destedit="1">変える</button></div>`;
  return `<div style="margin-bottom:10px"><label class="q" for="dest-name">お届け先（事業所・会社の名前）<span class="req">必須</span></label>

// 入れたままの名前を、お届け先に決める（一覧と同じ名前なら事業所）
function commitDestName(){
  const q = destQ.trim(); if(!q) return false;
  const of = officeOf(q); setDest(of ? "office" : "free", of ? of.name : q); destEdit = false; destQ = ""; return true;
}
// 選んだ事業所の、これから先のいちばん近いお届け日（「12/10（木）」）
function nextDay(s){
  const on = s.kind==="office" ? s.office.days : kineya, now = new Date(); now.setHours(0,0,0,0);
  // 予約できる日（フォームの日）の最後より後の日だけ（それより前の日は、もう締め切りを過ぎている）
  const f = fieldOf("date"), last = Math.max(now, ...((f&&f.choices)||[]).map(dateOf).filter(Boolean));
  const ds = Object.keys(on).map(k=>{ const [mo,d] = k.split("-").map(Number); const dt = new Date(now.getFullYear(), mo-1, d); if(dt < now - 180*86400000) dt.setFullYear(dt.getFullYear()+1); return dt; }).filter(dt=>dt > last).sort((a,b)=>a-b);
  return ds.length ? (ds[0].getMonth()+1)+"/"+ds[0].getDate()+"（"+"日月火水木金土"[ds[0].getDay()]+"）" : "";
}
// 締め切りを過ぎたけれど、まだ来ていない、その事業所の日（明日から。取り置きのご依頼に使う）
function lateDays(s){
  const f = fieldOf("date"), now = new Date(); now.setHours(0,0,0,0);
  const on = s.kind==="office" ? s.office.days : kineya, open = {};
  const cd = ((f&&f.choices)||[]).map(dateOf).filter(Boolean); cd.forEach(d=>{ open[(d.getMonth()+1)+"-"+d.getDate()] = true; });
  const last = cd.length ? Math.max(...cd) : now.getTime() + 21*86400000;
  return Object.keys(on).filter(k=>!open[k]).map(k=>{ const [mo,d] = k.split("-").map(Number); const dt = new Date(now.getFullYear(), mo-1, d); if(dt < now - 180*86400000) dt.setFullYear(dt.getFullYear()+1); return dt; })
    .filter(dt=>dt > now && dt <= last).sort((a,b)=>a-b);
}
const dLabel = d => (d.getMonth()+1)+"/"+d.getDate()+"（"+"日月火水木金土"[d.getDay()]+"）";
const dText = d => (d.getMonth()+1)+"月"+d.getDate()+"日";
// お届け日の選べる日（フォームの［納品希望日］の日のうち、選んだ事業所の日だけ）
function dateChoices(){
  const f = fieldOf("date"); if(!f) return [];
  const s = destSel(), all = f.choices||[];
  const on = s && s.kind==="office" ? s.office.days : s && s.kind==="kineya" ? kineya : null;
  if(!on || !Object.keys(on).length || (s.kind==="office" && s.office.flex)) return all;
  return all.filter(c=>{ const d = dateOf(c); return d && on[(d.getMonth()+1)+"-"+d.getDate()]; });
}
function wkOf(n){ return /サンドイッチ/.test(n) ? "sand" : /^調理パン$/.test(n) ? "chori" : /^ピザパン$/.test(n) ? "pizza" : ""; }
function todayWk(){ const dt = chosenDate(); return weekly && dt ? (weekly[(dt.getMonth()+1)+"-"+dt.getDate()] || null) : null; }
function wkText(b, w){ return !w ? "" : b.wk==="sand" ? (w.sand.length>1 ? w.sand.join("／")+"から選べます" : w.sand.join("")) : (w[b.wk]||""); }
// サンドイッチの中身を選ぶ（2つから選べる日だけ）。お届け日で中身が変わったら選び直し
function sandOpts(){ const w = todayWk(); return w && w.sand.length>1 ? w.sand : []; }
function sandState(){
  const o = sandOpts(), key = o.join("/");
  if(sandPick.key!==key) sandPick = {key, n:{}};
  const b = breads.find(x=>x.wk==="sand"), q = b ? (cart[b.id]||0) : 0;
  let sum = o.reduce((s,k)=>s+(sandPick.n[k]||0),0);
  for(let i=o.length-1; sum>q && i>=0; i--){ while(sum>q && sandPick.n[o[i]]>0){ sandPick.n[o[i]]--; sum--; } }
  return {o, b, q, sum};
}

/* ---------- お届け日と、その日に頼めるパン ---------- */
function dateOf(s){
  const m = nk(s).match(/(\d{1,2})月(\d{1,2})日/); if(!m) return null;
  const now = new Date(), mo = Number(m[1]), d = Number(m[2]);
  let y = now.getFullYear(); if(mo < now.getMonth()+1-1) y++;   // 年をまたぐとき
  return new Date(y, mo-1, d);
}
function chosenDate(){ const f=fieldOf("date"); if(!f) return null; const v=vals[f.id]; return v==="__other" ? dateOf(vals[f.id+"_o"]) : dateOf(v); }
// 説明の「10月中のお届けのみ」「11月1日からのお届け」を読む
function availability(b, dt){
  if(!dt) return {ok:true};
  if(isKineya(dt) && /食パン|ドーナツ/.test(b.name)) return {ok:false, why:"喜ね舎の出店日はお休み"};
  let m = b.help.match(/(\d{1,2})月中のお届けのみ/);
  if(m && dt.getMonth()+1!==Number(m[1])) return {ok:false, why:m[1]+"月中のお届けのみ"};
  m = b.help.match(/(\d{1,2})月(\d{1,2})日から/);
  if(m){ const from = new Date(dt.getFullYear(), Number(m[1])-1, Number(m[2])); if(from - dt > 200*86400000) from.setFullYear(from.getFullYear()-1); if(dt < from) return {ok:false, why:m[1]+"月"+m[2]+"日からのお届け"}; }
  return {ok:true};
}

function answerOf(f){ const v=vals[f.id]; return v==="__other" ? (vals[f.id+"_o"]||"").trim() : (v||"").trim(); }
function collect(){
  const ans = {}, miss = [], extra = [];
  const dt = chosenDate();
  breads.forEach(b=>{ const q=cart[b.id]||0; if(!q) return;
    const a=availability(b,dt); if(!a.ok) miss.push(`「${b.name}」は${a.why}です。数を0にするか、お届け日を変えてください`);
    if(q>=5){ ans[b.id]=b.five||"5個以上"; extra.push(`${b.name} ${q}個`); }
    else ans[b.id]=(b.choices.find(c=>nk(c)===String(q))||String(q)); });
  // サンドイッチの中身（2つから選べる日）を連絡欄に書く
  const S = sandState(); let sand = "";
  if(S.o.length && S.q){
    if(S.sum<S.q) miss.push(`手作りサンドイッチの中身（${S.o.join("／")}）を、あと${S.q-S.sum}個選んでください`);
    else sand = "【サンドイッチ】" + S.o.filter(k=>sandPick.n[k]).map(k=>k+sandPick.n[k]).join("・");
  }
  fields.forEach(f=>{
    const hidden = (f.kind==="mail" && !recvIs(/メール/)) || (f.kind==="line" && !recvIs(/LINE/));
    let v = hidden ? "" : answerOf(f);
    if(f.kind==="msg" && sand) v = (v?v+"\n":"") + sand;
    if(f.kind==="msg" && extra.length) v = (v?v+"\n":"") + "【5個以上の数】" + extra.join("、");
    // どちらの予約から来たか事務所で分かるように、連絡欄の頭に印を付ける
    if(f.kind==="msg" && dateMode==="late" && chosenDate()) v = (v?v+"\n":"") + "【取り置き】締め切り後のご依頼（持ち込む数の範囲で）";
    if(f.kind==="msg" && dateMode==="other") v = (v?v+"\n":"") + "【決まった日以外】理由：" + dateReason.trim();
    if(f.kind==="msg") v = "（らくらく予約）" + (v?"\n"+v:"");
    if(v) ans[f.id]=v; else if(f.required) miss.push(`「${f.title.replace(/^[\s「]+|[」\s]+$/g,"")}」を入れてください`);
    if(f.kind==="mail" && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) miss.push("メールアドレスの形を確かめてください");
  });
  if(recvIs(/メール/) && fieldOf("mail") && !answerOf(fieldOf("mail"))) miss.push("明細をメールで受け取るときは、メールアドレスを入れてください");
  if(recvIs(/LINE/) && fieldOf("line") && !answerOf(fieldOf("line"))) miss.push("LINEで受け取るときは、LINEのお名前を入れてください");
  if(!count()) miss.push("パンを選んでください");
  if(dateMode==="other" && !dateReason.trim()) miss.push("決まった日以外を希望する理由を書いてください");
  const ds = destSel(); if(fieldOf("dest") && (!ds || !ds.label) && !miss.some(x=>/お届け先/.test(x))) miss.push("「お届け先」を選んでください");
  return {ans, miss};
}
async function send(){
  const {ans, miss} = collect();
  if(miss.length){ showErr(miss.map(esc).join("<br>")); return; }
  sending = true; render();
  try{
    const res = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({answers:ans})});
    const j = await res.json();
    if(!j.ok) throw new Error(j.msg||"受け付けられませんでした");
    fields.forEach(f=>{ if(!["date","msg"].includes(f.kind)){ mem[f.title]=vals[f.id]; if(vals[f.id]==="__other") mem[f.title+"_o"]=vals[f.id+"_o"]; } }); remember();
    renderDone(ans);
  }catch(e){
    sending = false; render();
    showErr(`送れませんでした（${esc(e.message||e)}）。<br>電波のよい所で、もう一度【予約する】を押してください。何度もだめなときは <a href="${FORM_URL}">Googleフォーム</a> からご予約ください。`);
    return;
  }
}
function renderDone(ans){
  const L = breads.filter(b=>cart[b.id]), name = fields.filter(f=>f.kind==="other" && /お名前/.test(f.title)).map(answerOf).join("");
  const df = fieldOf("date"), when = df ? answerOf(df) : "", w = todayWk(), S = sandState();
  const sub = b => b===S.b && S.o.length ? S.o.filter(k=>sandPick.n[k]).map(k=>k+" "+sandPick.n[k]+"個").join("・") : (b.wk ? wkText(b,w) : "");
  $("app").innerHTML = `<div class="box done">
     <h2 style="margin-top:0">ご予約を受け付けました</h2>
     <p>${esc(when)}　${esc(name)} 様</p>
     <div class="lines">${L.map(b=>`<div class="line"><div>${esc(b.name)}${sub(b)?`<small>${esc(sub(b))}</small>`:""}</div><div>${cart[b.id]}個</div><div class="amt">${yen(b.price*cart[b.id])}</div></div>`).join("")}</div>
     <div class="total"><span>合計（税込）</span><span class="v">${yen(total())}</span></div>
     <p class="note">この画面を残しておくときは、スクリーンショットを撮ってください。明細は、選んだ方法（メール／LINE）でお送りします。</p>
     ${recvIs(/LINE/) && !IN_LINE?`<div style="margin-top:10px"><a class="btn primary" href="${LINE_ADD}" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">LINEを開いて ひまわりを友だち追加</a>
       <p class="note" style="margin:6px 0 0">明細をLINEで受け取るには、ひまわりのLINE公式アカウントの友だち登録と、最初のメッセージ（「○○です」など）が必要です。もう友だちの方は、そのままで大丈夫です。</p></div>`:""}
     ${fields.lineNote && recvIs(/LINE/)?`<div class="err"><b>${esc(fields.lineNote.title)}</b><p class="note" style="margin:4px 0 0">${esc(fields.lineNote.help)}</p></div>`:""}
   </div>
   <div class="row" style="margin-top:12px"><button class="btn" type="button" id="b-again">ほかの日も予約する</button></div>`;
  step = "done"; sending = false; cart = {}; sandPick = {key:"", n:{}}; render();
}

/* ---------- 操作 ---------- */
document.addEventListener("click", e=>{
  const t = e.target;
  const c = t.closest("[data-cat]"); if(c && c.tagName==="BUTTON" && !c.classList.contains("item")){ catFilter=c.dataset.cat; render(); return; }
  const a = t.closest("[data-add]"); if(a){ if(a.classList.contains("off")) return; cart[a.dataset.add]=(cart[a.dataset.add]||0)+1; render(); return; }
  const inc = t.closest("[data-inc]"), dec = t.closest("[data-dec]");
  if(inc){ cart[inc.dataset.inc]++; render(); return; }
  if(dec){ const k=dec.dataset.dec; cart[k]--; if(cart[k]<=0) delete cart[k]; if(!count()){ step="pick"; } render(); return; }
  const si = t.closest("[data-sinc]"), sd = t.closest("[data-sdec]");
  if(si||sd){ const S=sandState(), k=S.o[Number((si||sd).dataset[si?"sinc":"sdec"])]; if(k==null) return;
    if(si && S.sum<S.q) sandPick.n[k]=(sandPick.n[k]||0)+1;
    if(sd && sandPick.n[k]>0) sandPick.n[k]--;
    render(); return; }
  if(t.closest("[data-destedit]")){ destEdit = true; destQ = ""; render(); const s=$("dest-name"); if(s) s.focus(); return; }
  const ob = t.closest("[data-office]"); if(ob){ setDest("office", ob.dataset.office); destEdit = false; destQ = ""; render(); return; }
  const pb = t.closest("[data-pre]"); if(pb){ setDest("pre", pb.dataset.pre); destEdit = false; destQ = ""; render(); return; }
  if(t.closest("[data-kineya]")){ setDest("kineya"); destEdit = false; destQ = ""; render(); return; }
  if(t.closest("[data-destfree]")){ commitDestName(); render(); return; }
  // 名前を入れたまま「次へ」を押したときも、その名前で決める
  if(t.id==="b-next" && $("dest-name") && destQ.trim()) commitDestName();
  const dm = t.closest("[data-dmode]"); if(dm){ dateMode = dm.dataset.dmode; dateReason = ""; const df=fieldOf("date"); if(df){ delete vals[df.id]; delete vals[df.id+"_o"]; } render(); return; }
  const lt = t.closest("[data-late]"); if(lt){ const df=fieldOf("date"); if(df){ vals[df.id]="__other"; vals[df.id+"_o"]=lt.dataset.late; } render(); return; }
  const dc = t.closest("[data-date]"); if(dc){ const df=fieldOf("date"); if(df){ vals[df.id]=dc.dataset.date; delete vals[df.id+"_o"]; } render(); return; }
  if(t.id==="b-next"){ if(step==="pick"){ step="info"; render(); window.scrollTo(0,0); } else send(); }
  if(t.id==="b-back"){ step="pick"; render(); window.scrollTo(0,0); }
  if(t.id==="b-again"){ step="pick"; dateMode=""; dateReason=""; const df=fieldOf("date"); if(df){ delete vals[df.id]; } render(); window.scrollTo(0,0); }
});
function onField(e){
  const id = e.target.id;
  if(id==="date-reason"){ dateReason = e.target.value; return; }
  if(id==="dest-name"){
    destQ = e.target.value;
    // 一覧と同じ名前を全部入れたときは、そのまま決める
    // （「玉ノ江こども園」と「玉ノ江こども園（保護者・児童）」のように、ほかにも続きがある名前は決めない）
    const of = officeOf(destQ); if(of && e.type==="input" && !offices.some(o=>o!==of && o.key.startsWith(of.key))){ setDest("office", of.name); destEdit = false; destQ = ""; render(); return; }
    const c = $("dest-cands"); if(c) c.innerHTML = candsHtml();
    return; }
  const k = e.target.dataset.f; if(!k) return;
  vals[k] = e.target.value;
  // 選び直したときは画面を描き直す（その他の欄・頼めるパン・メール/LINEの欄）
  if(e.type==="change" && (e.target.tagName==="SELECT" || e.target.type==="radio")) render();
}
document.addEventListener("input", onField);
document.addEventListener("change", onField);

// 前に読んだメニュー、なければ写し（form.json・1時間ごとに自動で作り直す）をすぐに出し、
// 裏で受け口から最新のメニューを読み直す（受け口は目を覚ますのに10〜20秒ほどかかることがある）
const FKEY = KEY + "-form";
const SNAP = "form.json";
function okInfo(t){ try{ const i = JSON.parse(t); return i && Array.isArray(i.items) && i.accepting ? i : null; }catch(e){ return null; } }
// 開いている間は受け口を起こしておく（送るときに待たないように）
let pings = 0;
const wake = setInterval(()=>{ if(++pings > 8){ clearInterval(wake); return; } if(API && !document.hidden) fetch(API).catch(()=>{}); }, 4*60*1000);
async function load(){
  let shown = "";
  try{ const c = localStorage.getItem(FKEY), i = c && okInfo(c); if(i){ build(i); render(); shown = c; } }catch(e){}
  const live = API ? fetch(API).then(r=>r.text()) : Promise.reject(new Error("受け口のアドレスがまだ入っていません"));
  live.catch(()=>{});
  if(!shown){
    try{ const t = await (await fetch(SNAP + "?v=" + Math.floor(Date.now()/600000), {cache:"no-cache"})).text(), i = okInfo(t); if(i){ build(i); render(); shown = t; } }catch(e){}
  }
  try{
    const txt = await live; const info = JSON.parse(txt);
    if(!info || !Array.isArray(info.items)) throw new Error("メニューを読めませんでした");
    try{ localStorage.setItem(FKEY, txt); }catch(e){}
    if(!info.accepting){ $("app").innerHTML = `<div class="err">今は予約を受け付けていません。</div>`; $("bar").hidden = true; return; }
    if(txt === shown) return;            // 前と同じなら、そのまま
    build(info);
    if(step==="pick" || !shown) render(); // 入力中の画面は描き直さない（次に画面が変わるときに新しい中身になる）
  }catch(e){
    if(shown) return;                    // 前のメニューで続けられる（送るときに受け口が確かめる）
    $("app").innerHTML = `<div class="err">メニューを読み込めませんでした（${esc(e.message||e)}）。<br>少しして開き直すか、<a href="${FORM_URL}">Googleフォーム</a> からご予約ください。</div>`;
  }
}
window.__yoyaku = {build, render, collect, get vals(){return vals;}, get cart(){return cart;}};
load();
})();
</script>
</body></html>
