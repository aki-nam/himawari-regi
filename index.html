<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>ひまわりボタンレジ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: phone-first register — menu button grid on top, a sticky total bar at the bottom that opens the checkout sheet */
:root{
  --bg:#f6f7f2; --surface:#ffffff; --fg:#1f2a24; --muted:#5d6b62; --line:#d9ded4;
  --accent:#1f6b4a; --accent-fg:#ffffff; --sun:#f2b705; --sun-fg:#2a2100;
  --cat1:#fdf1d6; --cat2:#e3f0e8; --cat3:#e6ecf7;
  --danger:#b3261e; --paypay:#d6002a;
  --f-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1b231f; --fg:#e8eee9; --muted:#9aa89f; --line:#2e3a33;
  --accent:#4fb385; --accent-fg:#0b1a12; --sun:#f2c33a; --sun-fg:#231b00;
  --cat1:#33291a; --cat2:#1d3127; --cat3:#1f2736; --danger:#ff8a80; --paypay:#ff5c7a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1b231f; --fg:#e8eee9; --muted:#9aa89f; --line:#2e3a33;
  --accent:#4fb385; --accent-fg:#0b1a12; --sun:#f2c33a; --sun-fg:#231b00;
  --cat1:#33291a; --cat2:#1d3127; --cat3:#1f2736; --danger:#ff8a80; --paypay:#ff5c7a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:980px;margin:0 auto;padding-bottom:120px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 6px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.25rem;margin:0;display:flex;align-items:center;gap:8px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 3px color-mix(in srgb,var(--sun) 30%,transparent)}
.place{display:flex;gap:6px;align-items:center;flex:1;min-width:0;justify-content:flex-end}
.place label{font-size:.85rem;color:var(--muted);white-space:nowrap}
.place input{min-width:0;width:13em;max-width:100%;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
nav{display:flex;gap:6px}
nav button{flex:1;font-family:var(--f-display);font-weight:800;font-size:1rem;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;font:inherit;font-size:.9rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px}
.item{position:relative;text-align:left;min-height:86px;padding:10px 10px 8px;border-radius:12px;border:1px solid var(--line);color:var(--fg);cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;gap:4px;font:inherit;-webkit-tap-highlight-color:transparent;transition:transform .06s}
.item:active{transform:scale(.97)}
.item[data-cat="菓子パン"]{background:var(--cat1)} .item[data-cat="惣菜パン"]{background:var(--cat2)} .item[data-cat="サンド・パイ・他"]{background:var(--cat3)}
.item .nm{font-family:var(--f-display);font-weight:800;font-size:1rem;line-height:1.3;word-break:break-word}
.item .pr{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem}
.badge{position:absolute;top:-6px;right:-6px;min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:var(--sun);color:var(--sun-fg);
  font-family:var(--f-display);font-weight:800;display:grid;place-items:center;font-size:1rem;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.bar .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .sum{flex:1;min-width:0}
.bar .cnt{font-size:.85rem;color:var(--muted)}
.bar .tot{font-family:var(--f-display);font-weight:800;font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.1}
.btn{font-family:var(--f-display);font-weight:800;font-size:1.05rem;border-radius:12px;padding:12px 18px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sun{background:var(--sun);color:var(--sun-fg);border-color:var(--sun)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.item:focus-visible,nav button:focus-visible,.chips button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
/* checkout sheet */
.sheet{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;
  padding:14px max(14px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:var(--f-display);font-size:1.15rem;margin:0}
.lines{display:flex;flex-direction:column;gap:6px}
.line{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.line .n{min-width:0}
.line .n small{display:block;color:var(--muted);font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:1.3rem;font-weight:700;cursor:pointer}
.qty span{min-width:2ch;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.amt{font-variant-numeric:tabular-nums;font-weight:700;min-width:5.5ch;text-align:right}
.big{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-weight:800}
.big .v{font-size:2rem;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{font-family:var(--f-display);font-weight:800;font-size:1.05rem;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"][data-pay="現金"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.seg button[aria-pressed="true"][data-pay="PayPay"]{border-color:var(--paypay);background:color-mix(in srgb,var(--paypay) 12%,var(--surface))}
.cash{display:flex;flex-direction:column;gap:8px}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.quick button{font-family:var(--f-display);font-weight:800;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums}
.paid{display:flex;gap:8px;align-items:center}
.paid input{flex:1;min-width:0;font:inherit;font-size:1.3rem;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font-variant-numeric:tabular-nums}
.change{font-family:var(--f-display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}
.change.short{color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
/* sales & menu tabs */
section h2{font-family:var(--f-display);font-size:1.15rem;margin:14px 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.card .k{font-size:.85rem;color:var(--muted)} .card .v{font-family:var(--f-display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.muted{color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted)}
select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:6px 8px}
textarea{width:100%;min-height:9em}
.medit input[type=text],.medit input[type=number]{font:inherit;width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.medit td{vertical-align:middle}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-family:var(--f-display);font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.confirm{background:color-mix(in srgb,var(--danger) 10%,var(--surface));border:1px solid var(--danger);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.note{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.item{transition:none}}
.banner{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--sun);border-radius:12px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.banner b{font-family:var(--f-display)}
.banner .note{margin:0}
.carry{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.carry button{font:inherit;font-size:.9rem;padding:6px 12px;border-radius:999px;border:1px solid var(--sun);background:var(--surface);color:var(--fg);cursor:pointer}
.carry .on{font-size:.9rem;font-weight:700}
.fix{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--danger);border-radius:12px;padding:8px 12px;margin-top:10px}
.fix ul{margin:4px 0 0;padding-left:1.2em}
.item .rem{font-size:.85rem;font-weight:700;color:var(--accent)}
.item .rem.zero{color:var(--danger)}
.item.out .nm,.item.out .pr{opacity:.55}
.item .want{align-self:flex-start;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--danger);color:var(--danger);background:var(--surface)}
.buyer{display:flex;flex-direction:column;gap:6px}
.buyer .chips{flex-wrap:wrap;overflow:visible;max-height:9.5em;overflow-y:auto}
.buyer .chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.buyer input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-width:0;width:100%}
.tbl td.zero{color:var(--muted)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--cat2);font-size:.8rem}
/* 販売メモ（納品明細に手で書いていたこと） */
.memo{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.memo label{font-size:.85rem;color:var(--muted);display:block;margin-bottom:2px}
.memo input,.memo textarea{font:inherit;width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.memo textarea{min-height:3.2em}
.memo .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.memo .chips{flex-wrap:wrap;overflow:visible}
.memo .chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.memo .loss button.sold{border-color:var(--danger)}
.lossrow{display:flex;align-items:center;gap:6px;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.lossrow .qty button{width:34px;height:34px;font-size:1.1rem}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <h1><span class="dot" aria-hidden="true"></span>ひまわりボタンレジ</h1>
      <div class="place"><label for="place">販売先</label><input id="place" type="text" placeholder="例：福井テレビ" autocomplete="off"></div>
    </div>
    <nav role="tablist">
      <button id="tab-reg" role="tab" aria-selected="true" data-tab="reg">レジ</button>
      <button id="tab-sales" role="tab" aria-selected="false" data-tab="sales">売上</button>
      <button id="tab-menu" role="tab" aria-selected="false" data-tab="menu">設定</button>
    </nav>
    <div id="batchbar"></div>
    <div class="chips" id="chips"></div>
  </header>

  <main>
    <section id="v-reg"><div class="grid" id="grid"></div></section>
    <section id="v-sales" hidden></section>
    <section id="v-menu" hidden></section>
  </main>
</div>

<div class="bar" id="bar">
  <div class="in">
    <div class="sum"><div class="cnt" id="cnt">0点</div><div class="tot" id="tot">¥0</div></div>
    <button class="btn" id="clear" type="button">クリア</button>
    <button class="btn sun" id="open" type="button">会計へ</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-labelledby="sh-title">
    <h2 id="sh-title">会計</h2>
    <div class="lines" id="lines"></div>
    <div class="big"><span>合計</span><span class="v" id="sh-tot">¥0</span></div>
    <div class="buyer" id="buyer"></div>
    <div class="seg" id="pay">
      <button type="button" data-pay="現金" aria-pressed="true">現金</button>
      <button type="button" data-pay="PayPay" aria-pressed="false">PayPay</button>
    </div>
    <div class="cash" id="cash">
      <div class="quick" id="quick"></div>
      <div class="paid"><label for="paid" class="muted">お預かり</label><input id="paid" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></div>
      <div class="big"><span>おつり</span><span class="change" id="change">—</span></div>
    </div>
    <div class="row">
      <button class="btn" id="back" type="button">戻る</button>
      <button class="btn primary" id="done" type="button">会計する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>

function catOf(n){
  if(/ホイップサンド/.test(n)) return "菓子パン";
  if(/サンド|パイ|食パン|ドーナツ/.test(n)) return "サンド・パイ・他";
  if(/調理|キャベツ|バーガー|カレー|ウインナー|ウィンナー|ベーコン|ホットドッグ|ハムエッグ|ピザ|ダブルチーズ|おやき|ちくわ/.test(n)) return "惣菜パン";
  return "菓子パン";
}

{ const have=new Set(S.menu.map(r=>toTime(r[0]))); DEFAULT_MENU.forEach(r=>{ if(!have.has(toTime(r[0]))) S.menu.push(r.slice()); }); }

/* その日に使うメニュー（適用開始日がその日以前でいちばん新しい月） */
function menuFor(dateStr){
  const t = toTime(dateStr); let best = null;
  S.menu.forEach(r=>{ const rt=toTime(r[0]); if(rt<=t && (best===null || rt>best)) best=rt; });
  if(best===null && S.menu.length) best = Math.min(...S.menu.map(r=>toTime(r[0])));
  return S.menu.filter(r=>toTime(r[0])===best).sort((a,b)=>a[1]-b[1])
    .map(r=>({no:r[1], name:String(r[2]).trim(), price:Number(r[3]), cat:S.cats[String(r[2]).trim()]||catOf(String(r[2])), show:!S.hidden[String(r[2]).trim()], start:r[0]}));
}
function workDate(){ return S.batch ? S.batch.date : today(); }
function curMenu(){ return menuFor(workDate()); }

function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }

/* ---------- QR（#r1.日付.販売先.番号~数_…）を読む ---------- */
function b64urlDecode(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="=";
  const bin = atob(s); const bytes = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function readHash(){
  const h = (location.hash||"").replace(/^#/,""); if(!/^r1\./.test(h)) return;
  try{
    const p = h.split("."); const d = p[1]; const date = d.slice(0,4)+"-"+d.slice(4,6)+"-"+d.slice(6,8);
    const place = b64urlDecode(p[2]);
    const items = (p[3]||"").split("_").filter(Boolean).map(x=>{ const [no,q]=x.split("~").map(Number); return {no,qty:q}; }).filter(x=>x.no>0&&x.qty>0);
    const key = date+"|"+place;
    // QRを読み直しても、前の販売先から足した分は消さない
    const old = S.batches[key], nb = {date, place, items};
    // 持参数を直した分も消さない
    if(old && (old.carry || old.adj)){ nb.qr = items; if(old.carry) nb.carry = old.carry; if(old.adj) nb.adj = old.adj; }
    if(old && old.carriedTo) nb.carriedTo = old.carriedTo;
    S.batches[key] = nb; recompute(key);
    const isNew = !S.batch || S.batch.key!==key;
    S.batch = {key, date, place, items:nb.items}; S.place = place; S.via = null; S.mode = "batch"; save();
    // 初めて読んだQRで、同じ日の前の販売先に残りがあれば、自動で持参に足す（持ち帰るときは【足した分を外す】）
    const auto = (isNew && !old) ? autoCarry() : "";
    if(isNew){ cart={}; setTimeout(()=>toast(jpDate(date)+"　"+place+" の持参分（"+items.length+"品）を読み込みました"+auto),300); }
  }catch(e){ setTimeout(()=>toast("QRの内容を読み取れませんでした"),300); }
}

/* ---------- 売れた数・残り ---------- */
function soldIn(key){ const c={}; S.sales.filter(s=>s.batchKey===key).forEach(s=>s.items.forEach(i=>{ c[i.no]=(c[i.no]||0)+i.qty; })); return c; }
function remaining(){ if(!S.batch) return null; const sold=soldIn(S.batch.key), r={}; S.batch.items.forEach(i=>{ r[i.no]=i.qty-(sold[i.no]||0)-(cart[i.no]||0); }); return r; }

/* ---------- 前の販売先の残りを足す（同じ日に先に回った販売先の残りを、今の持参に足す） ---------- */
function mergeItems(a, b){ const m={}; a.concat(b).forEach(i=>{ m[i.no]=(m[i.no]||0)+i.qty; }); return Object.keys(m).map(Number).sort((x,y)=>x-y).map(no=>({no,qty:m[no]})); }
function restOf(key){ const b=S.batches[key]; if(!b) return []; const sold=soldIn(key); return b.items.map(i=>({no:i.no,qty:i.qty-(sold[i.no]||0)})).filter(i=>i.qty>0); }
function carryCands(){
  if(!S.batch) return []; const cur=S.batches[S.batch.key]; if(!cur || cur.carry) return [];
  return Object.entries(S.batches).filter(([k,b])=>k!==S.batch.key && b.date===S.batch.date && !b.carriedTo)
    .map(([k,b])=>{ const rest=restOf(k); return {k, place:b.place, rest, n:rest.reduce((s,i)=>s+i.qty,0)}; }).filter(x=>x.n>0);
}
function setBatchItems(key){ if(S.batch && S.batch.key===key) S.batch.items=S.batches[key].items; }
// 持参 ＝ QRの数 ＋ 前の販売先から足した数 ＋ その場で直した数（adj）
function recompute(key){
  const b=S.batches[key]; if(!b) return;
  if(!b.qr){ if(!b.carry && !b.adj) return; b.qr=b.items.map(i=>({no:i.no,qty:i.qty})); }
  const m={}; mergeItems(b.qr, b.carry?b.carry.items:[]).forEach(i=>m[i.no]=i.qty);
  Object.entries(b.adj||{}).forEach(([no,d])=>{ m[no]=(m[no]||0)+d; });
  b.items = Object.keys(m).map(Number).sort((x,y)=>x-y).map(no=>({no,qty:m[no]})).filter(i=>i.qty>0);
  setBatchItems(key);
}
function addCarry(fromKey, quiet){
  const c=carryCands().find(x=>x.k===fromKey); if(!c) return; const key=S.batch.key, b=S.batches[key];
  if(!b.qr) b.qr = b.items.map(i=>({no:i.no,qty:i.qty})); b.carry = {fromKey, from:c.place, items:c.rest};
  S.batches[fromKey].carriedTo = key; recompute(key); save();
  if(!quiet) toast(c.place+" の残り "+c.n+"個を持参に足しました");
}
// いちばん最近まで売っていた販売先の残りを足す。足したら案内の文を返す
function autoCarry(){
  const C=carryCands(); if(!C.length) return "";
  const lastTs=k=>S.sales.filter(s=>s.batchKey===k).reduce((m,s)=>Math.max(m,s.ts),0);
  C.sort((a,b)=>lastTs(b.k)-lastTs(a.k)); const c=C[0];
  addCarry(c.k, true); return "。"+c.place+" の残り "+c.n+"個も足しました（持ち帰るときは【足した分を外す】）";
}
function removeCarry(key){
  const b=S.batches[key]; if(!b || !b.carry) return;
  if(S.batches[b.carry.fromKey]) delete S.batches[b.carry.fromKey].carriedTo;
  delete b.carry; recompute(key); save();
  toast("足した分を外しました");
}

function cartList(){ return Object.entries(cart).filter(([no,q])=>q>0 && item(no)).map(([no,q])=>({m:item(no),q})); }
function cartTotal(){ return cartList().reduce((s,x)=>s+x.m.price*x.q,0); }
function cartCount(){ return cartList().reduce((s,x)=>s+x.q,0); }

// 【販売先を変える】：QRの無い販売先で、QRのパンを続けて売る（売上・お名前・販売メモはその販売先として別に残る）
function placePanel(){
  const cands=[S.batch.place];
  S.sales.filter(s=>s.batchKey===S.batch.key).forEach(s=>cands.push(s.place));
  Object.keys(S.roster||{}).forEach(c=>cands.push(c));
  S.sales.slice(-200).forEach(s=>cands.push(s.place));
  const seen=new Set(), list=cands.filter(p=>p && !seen.has(norm(p)) && seen.add(norm(p))).slice(0,30);
  return `<div class="carry" style="flex-direction:column;align-items:stretch">
    <label for="np" class="muted">次に売る販売先（QRが無い所）</label>
    <input id="np" type="text" placeholder="販売先の名前" autocomplete="off" style="font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)">

}

/* ---------- 会計 ---------- */
function rosterFor(place){
  const p = norm(place); if(!p) return [];
  let names = [];
  Object.entries(S.roster||{}).forEach(([co,list])=>{ if(samePlace(co,place)) names = names.concat(list); });
  // その場で足した名前（名簿に入るまで、このスマホに残す）
  Object.entries(S.newNames||{}).forEach(([pl,list])=>{ if(samePlace(pl,place)) names = names.concat(list); });
  // この販売先で前に買った人を先頭に
  const recent = []; S.sales.slice().reverse().forEach(s=>{ if(s.buyer && norm(s.place)===p && !recent.includes(s.buyer)) recent.push(s.buyer); });
  return [...new Set(recent.concat(names))].filter(n=>n!=="-");
}
function samePlace(a, b){ const x=norm(a), y=norm(b); return !!x && !!y && (x.includes(y)||y.includes(x)); }
function inRoster(place, name){ return Object.entries(S.roster||{}).some(([co,l])=>samePlace(co,place) && l.some(n=>norm(n)===norm(name))); }
// 名簿に無い名前で会計したら「足した名前」に残す
function rememberName(place, name){
  if(!name || inRoster(place,name)) return;
  S.newNames=S.newNames||{}; const l=S.newNames[place]=S.newNames[place]||[];
  if(!l.some(n=>norm(n)===norm(name))) l.push(name);
}
// 名簿の見出し（得意先名）に合わせる。無ければ販売先のまま
function rosterHead(place){ const h=Object.keys(S.roster||{}).find(co=>samePlace(co,place)); return h||place; }
function renderBuyer(){
  const all = rosterFor(S.place); const q = norm(buyerQuery);
  const list = (q ? all.filter(n=>norm(n).includes(q)) : all).slice(0,60);
  $("buyer").innerHTML = `<div class="muted">お名前（なくてもOK）${buyer?`：<b>${esc(buyer)}</b>`:""}</div>
    <input id="bq" type="text" placeholder="名前で探す・新しい人はここに入れる" value="${esc(buyerQuery)}" autocomplete="off">
    <div class="chips">${buyerQuery && !all.some(n=>norm(n)===q) ? `<button type="button" data-buyer="${esc(buyerQuery.trim())}">＋「${esc(buyerQuery.trim())}」</button>`:""}
      ${list.map(n=>`<button type="button" data-buyer="${esc(n)}" aria-pressed="${n===buyer}">${esc(n)}</button>`).join("")}
      ${!all.length && !buyerQuery ? `<span class="note">名簿は「設定」で入れられます。</span>`:""}</div>`;
}
function openSheet(){ if(!cartCount()) return; $("sheet").hidden=false; $("paid").value=""; buyer=""; buyerQuery=""; renderSheet(); renderBuyer(); }

  const batchKey = S.batch && (norm(S.batch.place)===norm(place) || S.via===S.batch.key) ? S.batch.key : null;

/* ---------- 売上 ---------- */
// 売上をまとめる単位（日付＋販売先）。QRのパンを持ったままQRなしの販売先で売った分は、その販売先として別にまとめる
function groupKeyOf(s){
  if(!s.batchKey) return s.date+"|"+s.place;
  const b=S.batches[s.batchKey], bp=b?b.place:s.batchKey.split("|").slice(1).join("|");
  return norm(s.place)===norm(bp) ? s.batchKey : s.batchKey.split("|")[0]+"|"+s.place;
}
function groups(){
  const g={}, via={}; S.sales.forEach(s=>{ const k=groupKeyOf(s); (g[k]=g[k]||[]).push(s); if(s.batchKey && k!==s.batchKey) via[k]=s.batchKey; });
  if(S.batch && !g[S.batch.key]) g[S.batch.key]=[];
  const ck=curKey(); if(ck && ck!==S.batch.key && !g[ck]){ g[ck]=[]; via[ck]=S.batch.key; }
  return Object.keys(g).sort().reverse().map(k=>({k,date:k.split("|")[0],place:k.split("|").slice(1).join("|"),list:g[k],batch:via[k]?null:(S.batches[k]||null),via:via[k]||null}));
}
// 今売っている販売先のまとめのキー（QRの販売先なら、そのQRのキー）
function curKey(){
  if(!S.batch) return null; const p=(S.place||"").trim();
  return (!p || norm(p)===norm(S.batch.place)) ? S.batch.key : S.batch.date+"|"+p;
}
// QRのパンで、ほかの（QRなしの）販売先で売った数
function othersOf(key){
  const o={}; S.sales.filter(s=>s.batchKey===key && groupKeyOf(s)!==key).forEach(s=>{ const p=o[s.place]=o[s.place]||0; o[s.place]=p+s.items.reduce((a,i)=>a+i.qty,0); });
  return Object.entries(o).map(([place,n])=>({place,n}));
}
function summarize(g){
  const menu = menuFor(g.date); const items={}; let cash=0,pp=0;
  g.list.forEach(s=>{ s.items.forEach(i=>{ const o=items[i.no+"|"+i.name]=items[i.no+"|"+i.name]||{no:i.no,name:i.name,qty:0,amt:0,brought:null}; o.qty+=i.qty; o.amt+=i.qty*i.price; }); if(s.pay==="PayPay") pp+=s.total; else cash+=s.total; });
  if(g.batch) g.batch.items.forEach(b=>{ const m=menu.find(x=>x.no===b.no); const nm=m?m.name:("番号"+b.no); const k=b.no+"|"+nm; items[k]=items[k]||{no:b.no,name:nm,qty:0,amt:0}; items[k].brought=b.qty; });
  // 前の販売先から足した数と、QRの持参数（発注DBの数量）
  if(g.batch){ const add={}, org={}; (g.batch.carry?g.batch.carry.items:[]).forEach(i=>add[i.no]=i.qty); (g.batch.qr||g.batch.items).forEach(i=>org[i.no]=i.qty);
    const adj=g.batch.adj||{};
    // QRなしの販売先で売った分も含めた、売れた数（all）。残り・販売残はこれで出す
    const all=soldIn(g.k);
    Object.values(items).forEach(o=>{ o.carried=add[o.no]||0; o.org=org[o.no]||0; o.adj=adj[o.no]||0; o.all=Math.max(all[o.no]||0, o.qty); }); }
  const rows = Object.values(items).sort((a,b)=>a.no-b.no);
  return {rows, cash, pp, total:cash+pp, count:g.list.length, pieces:rows.reduce((s,r)=>s+r.qty,0), menu, others:g.batch?othersOf(g.k):[]};
}
/* ---------- 持参数を直す（QRを印刷したあとで、持って行く数を変えたとき） ---------- */

function changeBrought(key, no, d){
  const b=S.batches[key]; if(!b) return;
  const cur=(b.items.find(i=>i.no===no)||{qty:0}).qty; if(d<0 && cur<=0) return;

// 発注_統合_v2 の B列（持参数）を直す品：前の販売先から足した品・直した品・持参より多く売れた品
function fixList(g, sm){ return g.batch ? sm.rows.filter(r=>r.brought!=null||r.qty).map(r=>({r, to:Math.max(r.brought||0, r.all??r.qty)})).filter(x=>x.to!==(x.r.org||0)) : []; }

function copyText(kind){
  const g=groups().find(x=>x.k===salesKey); if(!g) return; const sm=summarize(g); let txt;
  if(kind==="line"){
    const cf = g.batch&&g.batch.carry ? `※ ${g.batch.carry.from} の残りを足して販売\n` : "", ct = g.batch&&g.batch.carriedTo&&S.batches[g.batch.carriedTo] ? `※ 残りは ${S.batches[g.batch.carriedTo].place} へ回しました\n` : "";
    const vp = g.via ? (S.batches[g.via]?S.batches[g.via].place:"QRの販売先") : "";
    const cv = vp ? `※ QRなし。${vp} のパンを続けて販売（持参・販売残は ${vp} の報告にまとめて）\n` : "";
    const co = sm.others.length ? `※ QRなしで回った販売先：${sm.others.map(o=>o.place+" "+o.n+"個").join("・")}（残りはそこで売れた分を引いた数）\n` : "";
    txt = `【${jpDate(g.date)} ${g.place} 売上】\nお客さま ${sm.count}人　${sm.pieces}個\n合計 ${yen(sm.total)}（現金 ${yen(sm.cash)}／PayPay ${yen(sm.pp)}）\n${cf}${ct}${cv}${co}\n` +
      sm.rows.filter(r=>r.qty||r.brought).map(r=>`・${r.name}　${r.qty}個${r.brought!=null?`（持参${r.brought}${r.carried?`うち足した${r.carried}`:""}${(r.all??r.qty)>r.qty?`・ほかで${r.all-r.qty}`:""}・残り${r.brought-(r.all??r.qty)}）`:""}　${yen(r.amt)}`).join("\n");
    const fx = fixList(g, sm); if(fx.length) txt += "\n\n【事務所へ】販売残を貼る前に、B列（持参数）を直す品\n" + fx.map(x=>`・${x.r.name}　${x.r.org||0} → ${x.to}`).join("\n");
    const ml = memoLines(g, sm); if(ml.length) txt += "\n\n" + ml.join("\n");
  } else if(kind==="memo"){
    const m=memoOf(g.k), t=memoTimes(g), c=s=>String(s||"").replace(/[\t\r\n]+/g," ");
    // 発注_統合_v2［販売メモ］の表と同じ並び。見出しは表にあるので、1行だけ
    txt = [g.date, g.place, m.who, m.wx, m.temp, (t.from||"")+"～"+(t.to||""), sm.count, sm.total, lossText(g), m.comment, m.want, nextText(m), m.info].map(c).join("\t");
  } else if(kind==="xls"){
    txt = ["日付\t販売先\t番号\t品名\t持参\t売れた\t残り\t金額"].concat(sm.rows.map(r=>`${g.date}\t${g.place}\t${r.no}\t${r.name}\t${r.brought??""}\t${r.qty}\t${r.brought!=null?r.brought-r.qty:""}\t${r.amt}`)).join("\n");
  } else if(kind==="zan"){
    // 販売実績入力の並び（その月のメニューの番号順・全品）に合わせて、残りの数だけ（0は空欄）
    // LINEで送ると空白の行が消えることがあるので、売り切れ・持参なしは 0 にする（0 は販売残なしとして登録される）
    const by = {}; sm.rows.forEach(r=>{ if(r.brought!=null){ const rest=r.brought-(r.all??r.qty); by[r.no]= rest>0?rest:0; } });
    txt = sm.menu.map(m=>by[m.no]===undefined?0:by[m.no]).join("\n");
  } else {
    txt = ["日付\t販売先\tお名前\t回数\t個数\t金額\t買ったパン"].concat(buyersOf(g).map(o=>`${g.date}\t${g.place}\t${o.n}\t${o.times}\t${o.pieces}\t${o.amt}\t${Object.entries(o.items).map(([k,q])=>k+"×"+q).join("、")}`)).join("\n");
  }
  putClip(txt, $("cp-area"));
}
function putClip(txt, ta){
  ta.value=txt;
  const fallback=()=>{ ta.hidden=false; ta.focus(); ta.select(); toast("文を選びました。長押しでコピーしてください"); };
  try{ navigator.clipboard.writeText(txt).then(()=>toast("コピーしました"),fallback); }catch(e){ fallback(); }
}

  slot.scrollIntoView({block:"center"});
}

function importMenu(){
  const rows=$("m-paste").value.split(/\r?\n/).map(l=>l.split("\t").map(x=>x.trim())).filter(p=>p.length>=4 && /\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}/.test(p[0]));
  const out = rows.map(p=>[p[0].replace(/-/g,"/"), Number(p[1]), p[2], Number(String(p[3]).replace(/[¥￥,，円\s]/g,""))]).filter(r=>r[1]>0 && r[2] && r[3]>0);
  if(!out.length){ toast("読み取れませんでした。適用開始日・番号・商品名・単価の4列を貼ってください"); return; }
  const months = [...new Set(out.map(r=>toTime(r[0])))];
  askConfirm(`${out.length}品（${[...new Set(out.map(r=>r[0]))].join("・")} から）を足します。同じ月の分は入れ替わります。`, ()=>{
    S.menu = S.menu.filter(r=>!months.includes(toTime(r[0]))).concat(out); save(); $("m-paste").value=""; renderMenu(); toast(out.length+"品を足しました"); });
}
function importRoster(){
  const lines=$("r-paste").value.split(/\r?\n/).filter(l=>l.trim()!==""); const R={};
  // LINEで送る形：「福井テレビ：山田、佐藤、…」を1行に1社
  lines.forEach(l=>{ const m=l.match(/^\s*[【\[]?名簿[】\]]?\s*$/); if(m) return; const p=l.match(/^\s*([^：:]+?)\s*[：:]\s*(.+)$/); if(p){ const names=p[2].split(/[、,，\/／]/).map(x=>x.trim()).filter(x=>x && x!=="-"); if(names.length) R[p[1].trim()]=[...new Set(names)]; } });
  // Excelの表をそのまま貼った形（1行目に得意先名、下に名前、タブ区切り）
  if(!Object.keys(R).length && lines.length>=2 && lines[0].includes("\t")){
    const head=lines[0].split("\t").map(x=>x.trim());
    head.forEach((h,i)=>{ if(!h) return; const names=[]; lines.slice(1).forEach(l=>{ const c=(l.split("\t")[i]||"").trim(); if(c && c!=="-" && !names.includes(c)) names.push(c); }); if(names.length) R[h]=names; });
  }
  const n=Object.keys(R).length; if(!n){ toast("名簿が読み取れませんでした。「得意先：名前、名前」の形で貼ってください"); return; }
  askConfirm(`${n}の得意先・${Object.values(R).reduce((s,l)=>s+l.length,0)}人を名簿に足します（同じ得意先は入れ替わります。何回かに分けて貼ってもOK）。`, ()=>{ S.roster=Object.assign({},S.roster||{},R); pruneNewNames(); save(); $("r-paste").value=""; renderMenu(); toast("名簿を足しました"); });
}
// 名簿に入った名前は「その場で足した名前」から外す
function pruneNewNames(){
  Object.keys(S.newNames||{}).forEach(p=>{ S.newNames[p]=S.newNames[p].filter(n=>!inRoster(p,n)); if(!S.newNames[p].length) delete S.newNames[p]; });
}

  const t=e.target;
  if(t.id==="cp-line") copyText("line"); if(t.id==="cp-xls") copyText("xls"); if(t.id==="cp-zan") copyText("zan"); if(t.id==="cp-buyer") copyText("buyer"); if(t.id==="cp-memo") copyText("memo");
  const bi=t.closest("[data-bqinc]"), bd=t.closest("[data-bqdec]");
  if(bi||bd){ const y=window.scrollY; changeBrought(salesKey, Number((bi||bd).dataset[bi?"bqinc":"bqdec"]), bi?1:-1); renderSales(); window.scrollTo(0,y); return; }
  if(t.id==="bq-open"){ editBrought=true; renderSales(); return; }
  if(t.id==="bq-close"){ editBrought=false; renderSales(); toast("持参数を直しました"); return; }
  if(t.id==="bq-reset"){ askConfirm("直した持参数を、QR（と前の販売先から足した分）の数に戻しますか？", ()=>{ const b=S.batches[salesKey]; if(b){ delete b.adj; recompute(salesKey); save(); } renderSales(); toast("元に戻しました"); }); return; }
  const wx=t.closest("[data-wx]"), ls=t.closest("[data-loss]"), ld=t.closest("[data-lossdec]");
  if(wx||ls||ld){ const m=memoOf(salesKey);
    if(wx) m.wx = m.wx===wx.dataset.wx ? "" : wx.dataset.wx;
    if(ls){ m.loss=m.loss||{}; m.loss[ls.dataset.loss]=(m.loss[ls.dataset.loss]||0)+1; }
    if(ld){ m.loss=m.loss||{}; m.loss[ld.dataset.lossdec]=Math.max(0,(m.loss[ld.dataset.lossdec]||0)-1); }
    save(); renderMemo(); return; }
  const u=t.closest("[data-undo]"); if(u) askConfirm("この会計を取り消しますか？", ()=>{ S.sales=S.sales.filter(s=>s.id!==u.dataset.undo); save(); renderSales(); toast("取り消しました"); });
  if(t.id==="del-group") askConfirm("この日・この販売先の記録を全部消します。先にコピーしましたか？", ()=>{ const k=salesKey; S.sales=S.sales.filter(s=>groupKeyOf(s)!==k); const db=S.batches[k]; if(db&&db.carry&&S.batches[db.carry.fromKey]) delete S.batches[db.carry.fromKey].carriedTo; Object.values(S.batches).forEach(b=>{ if(b.carriedTo===k) delete b.carriedTo; }); delete S.batches[k]; if(S.notes) delete S.notes[k]; if(S.batch&&S.batch.key===k) S.batch=null; salesKey=null; save(); renderSales(); toast("記録を消しました"); });
  const cf=t.closest("[data-cf]"); if(cf){ const fn=pendingConfirm; pendingConfirm=null; t.closest(".confirm").remove(); if(cf.dataset.cf==="yes"&&fn) fn(); }
});
function menuRowName(no){ const m=item(no); return m?m.name:null; }
$("v-menu").addEventListener("change",e=>{
  const tr=e.target.closest("tr[data-no]"); if(!tr) return; const no=Number(tr.dataset.no); const f=e.target.dataset.f; const nm=menuRowName(no); if(!nm) return;
  const start = curMenu()[0].start; const row = S.menu.find(r=>r[0]===start && r[1]===no);
  if(f==="show"){ if(e.target.checked) delete S.hidden[nm]; else S.hidden[nm]=true; }
  if(f==="cat") S.cats[nm]=e.target.value;
  if(f==="price" && row) row[3]=Math.max(0,Number(e.target.value)||0);
  if(f==="name" && row){ const nn=e.target.value.trim(); if(nn){ if(S.cats[nm]){ S.cats[nn]=S.cats[nm]; } if(S.hidden[nm]){ S.hidden[nn]=true; delete S.hidden[nm]; } row[2]=nn; } }
  save();
});
$("v-menu").addEventListener("click",e=>{
  const t=e.target;
  if(t.id==="m-import") importMenu();
  if(t.id==="m-reset") askConfirm("最初のメニューに戻しますか？（直した値段や名前も元に戻ります）", ()=>{ S.menu=DEFAULT_MENU.map(r=>r.slice()); S.cats={}; S.hidden={}; save(); renderMenu(); toast("最初のメニューに戻しました"); });
  if(t.id==="r-import") importRoster();
  if(t.id==="n-copy") putClip("【名簿に足す名前】\n"+Object.entries(S.newNames||{}).filter(([p,l])=>l.length).map(([p,l])=>rosterHead(p)+"："+l.join("、")).join("\n"), $("n-area"));
  if(t.id==="n-clear") askConfirm("その場で足した名前を消しますか？（事務所へ送ってから消してください）", ()=>{ S.newNames={}; save(); renderMenu(); toast("足した名前を消しました"); });
  if(t.id==="r-clear") askConfirm("このスマホの名簿を消しますか？", ()=>{ S.roster={}; save(); renderMenu(); toast("名簿を消しました"); });
  if(t.id==="b-clear") askConfirm("持参分を外しますか？（売上の記録は残ります）", ()=>{ S.batch=null; save(); renderMenu(); toast("持参分を外しました"); });
  const cf=t.closest("[data-cf]"); if(cf){ const fn=pendingConfirm; pendingConfirm=null; t.closest(".confirm").remove(); if(cf.dataset.cf==="yes"&&fn) fn(); }
});
window.addEventListener("hashchange",()=>{ readHash(); $("place").value=S.place||""; show("reg"); });

async function wake(){ try{ if("wakeLock" in navigator) await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") wake(); });
wake();

// 前に会計で入れた名前も「その場で足した名前」に入れる（1回だけ）
if(!S.nnMigrated){ S.sales.forEach(s=>rememberName(s.place, s.buyer)); S.nnMigrated=true; save(); }
readHash();
$("place").value=S.place||"";
show("reg");
})();
</script>

</body></html>
